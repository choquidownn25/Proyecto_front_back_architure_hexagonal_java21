<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="row justify-content-between">
      <div class="col-lg-4">
        <mat-form-field appearance="outline" class="w-100 hide-hint">
          <input
            matInput
            placeholder="Search User"
            (keyup)="doFilter($event)"
          />
          <mat-icon matSuffix>
            <i-tabler name="search" class="icon-20"></i-tabler>
          </mat-icon>
        </mat-form-field>
      </div>
      <div class="col-lg-4 d-flex align-items-center justify-content-end">
        <button mat-flat-button (click)="openDialog('Add', {})" color="primary">
          Add Product
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="table-responsive">
      <table mat-table [dataSource]="productos" class="w-100">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <!-- <th mat-header-cell *matHeaderCellDef> ID </th> -->
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">#</th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>
        <!-- Nombre Column -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Nombre</th>
          <td mat-cell *matCellDef="let element">
            <div class="d-flex align-items-center">
              <img
                class="rounded-circle"
                [src]="element.imagePath"
                width="40"
              />
              <div class="m-l-16">
                <p class="f-w-600 f-s-16 m-b-4 m-t-0">
                  {{ element.nombre }}
                </p>
                <!-- <small class="f-s-14">{{ element.Position }}</small> -->
              </div>
            </div>
          </td>
        </ng-container>
        <!-- Descripcion Column -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef  class="f-s-16 f-w-600">Descripcion</th>
          <td mat-cell *matCellDef="let element"  class="f-s-14">{{ element.descripcion }}</td>
        </ng-container>

        <!-- Precio Column -->
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Precio</th>
          <td mat-cell *matCellDef="let element"  class="f-s-14">{{ element.precio }}</td>
        </ng-container>

        <!-- Cantidad Column -->
        <ng-container matColumnDef="cantidad">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Cantidad</th>
          <td mat-cell *matCellDef="let element"  class="f-s-14">{{ element.cantidad }}</td>
        </ng-container>

        <!-- Imagen Column -->
        <ng-container matColumnDef="imagen">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Imagen</th>
          <td mat-cell *matCellDef="let element">
            <img [src]="element.imagen" alt="{{ element.nombre }}" width="50" />
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
            Actions
          </th>
          <td mat-cell *matCellDef="let element" class="action-link">
            <button
              mat-icon-button
              color="primary"
              (click)="openDialog('Update', element)"
            >
              <i-tabler name="pencil" class="icon-16"></i-tabler>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="openDialog('Delete', element)"
            >
              <i-tabler name="trash" class="icon-18"></i-tabler>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumn"></tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
      ></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
