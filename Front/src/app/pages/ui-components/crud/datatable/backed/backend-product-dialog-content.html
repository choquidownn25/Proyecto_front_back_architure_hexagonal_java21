<h2 class="f-w-500" mat-dialog-title>{{action}}</h2>

@if(action !== 'Delete') {
  
<mat-dialog-content>
  <form #userForm="ngForm">
    <div class="d-flex align-items-center m-b-16">
      <img
        class="mat-card-avatar"
        [src]="local_data.imagePath"
        class="rounded-circle"
        width="50"
      />
      <button mat-flat-button color="primary" class="m-l-16 input-file-button">
        <input type="file" (change)="selectFile($event)" #fileInput />
      </button>
    </div>
    <div class="row">
      <div class="col-lg-6">
        <mat-label class="f-s-14 f-w-600 m-b-8 d-block">Nombre</mat-label>
        <mat-form-field appearance="outline" class="w-100">
          <input
            type="text"
            matInput
            required
            id="nombre"
            name="nombre"
            [(ngModel)]="local_data.nombre"
            placeholder="Name"
          />
        </mat-form-field>
      </div>
      <div class="col-lg-6">
        <mat-label class="f-s-14 f-w-600 m-b-8 d-block">Descripcion</mat-label>
        <mat-form-field appearance="outline" class="w-100">
          <input
            type="text"
            matInput
            required
            id="descripcion"
            name="descripcion"
            [(ngModel)]="local_data.descripcion"
            placeholder="Descripcion"
          />
        </mat-form-field>
      </div>
   
      <div class="col-lg-6">
        <mat-label class="f-s-14 f-w-600 m-b-8 d-block"
          >Cantidad</mat-label
        >
        <mat-form-field appearance="outline" class="w-100">
          <input
            type="text"
            matInput
            required
            id="cantidad"
            name="cantidad"
            [(ngModel)]="local_data.cantidad"
            placeholder="Cantidad"
          />
        </mat-form-field>
      </div>
   
      <div class="col-lg-4">
        <mat-label class="f-s-14 f-w-600 m-b-8 d-block">Precio</mat-label>
        <mat-form-field appearance="outline" class="w-100">
          <input
            type="text"
            matInput
            required
            id="precio"
            name="precio"
            [(ngModel)]="local_data.precio"
            placeholder="Precio"
          />
        </mat-form-field>
      </div>
  
    </div>
    <button mat-flat-button (click)="doAction()" [disabled]="!userForm.valid">
      {{action}}
    </button>
    <button
      mat-flat-button
      class="m-l-8 bg-error text-white"
      (click)="closeDialog()"
    >
      Cancel
    </button>
  </form>
</mat-dialog-content>

} @else {
<div class="p-x-24">
  <p>Sure to delete <span class="f-w-600">{{local_data.nombre}}</span> ?</p>
</div>
<div mat-dialog-actions class="p-x-24 p-b-24">
  <button
    (click)="doAction()"
    mat-flat-button
    class="m-l-8 bg-error text-white"
  >
    {{action}}
  </button>
  <button mat-button (click)="closeDialog()" class="bg-light-error text-error m-l-8">Cancel</button>
</div>
}
