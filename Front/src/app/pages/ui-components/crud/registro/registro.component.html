<div
  class="blank-layout-container justify-content-center align-items-center bg-light"
>
  <div class="col-lg-4 d-flex align-items-center">
    <form class="m-t-30">
      <mat-card class="mb-0!">
        <mat-card-content>
          <div class="row m-t-24 custom-row">
            <div class="col-12 col-sm-6">
              <button mat-stroked-button class="w-100">
                <div class="d-flex align-items-center">
                  <img
                    src="/assets/images/svgs/google-icon.svg"
                    alt="google"
                    width="16"
                    class="m-r-8"
                  />
                  Sign in with Google
                </div>
              </button>
            </div>
            <div class="col-12 col-sm-6">
              <button
                mat-stroked-button
                class="w-100 d-flex align-items-center"
              >
                <div class="d-flex align-items-center">
                  <img
                    src="/assets/images/svgs/facebook-icon.svg"
                    alt="facebook"
                    width="40"
                    class="m-r-4"
                  />
                  Sign in with FB
                </div>
              </button>
            </div>
          </div>
          <div class="or-border m-t-30">or sign up with</div>

          <h4 class="text-base m-0 font-semibold mb-4">Account Details</h4>
          <mat-card-content class="border-t border-border">
            <br />
          </mat-card-content>
          <div class="grid grid-cols-12 gap-6">
            <div class="col-span-12 flex items-center">
              <mat-label class="text-sm font-semibold block mb-2"
                >Username
              </mat-label>
            </div>
            <div class="col-span-12">
              <mat-form-field appearance="outline" class="w-full">
                <input matInput placeholder="John Deo" />
              </mat-form-field>
            </div>
          </div>
          <div class="grid grid-cols-12 gap-6">
            <div class="col-span-12 flex items-center">
              <mat-label class="text-sm font-semibold block mb-2"
                >Email</mat-label
              >
            </div>
            <div class="col-span-12">
              <mat-form-field appearance="outline" class="w-full">
                <input matInput placeholder="john.deo" type="email" />
                <span matTextSuffix>&#64;exmaple.com</span>
              </mat-form-field>
            </div>
          </div>
          <div class="grid grid-cols-12 gap-6">
            <div class="col-span-12 flex items-center">
              <mat-label class="text-sm font-semibold block mb-2"
                >Password
              </mat-label>
            </div>
            <div class="col-span-12">
              <mat-form-field appearance="outline" class="w-full">
                <input matInput [type]="hide ? 'password' : 'text'" />
                <button
                  mat-icon-button
                  matSuffix
                  (click)="hide = !hide"
                  [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hide"
                >
                  <mat-icon class="opacity-50">{{
                    hide ? "visibility_off" : "visibility"
                  }}</mat-icon>
                </button>
              </mat-form-field>
            </div>

            <div class="grid grid-cols-12 gap-6">
              <div class="col-span-12 flex items-center">
                <mat-label class="text-sm font-semibold block mb-2"
                  >Rol
                </mat-label>
              </div>
              <div class="col-span-12">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-select value="0">
                    <mat-option value="0"></mat-option>
                    <mat-option value="admin">Administrador</mat-option>
                    <mat-option value="mod">Moredador</mat-option>
                    <mat-option value="User">Ususario</mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>

            <div class="grid grid-cols-12 gap-6 justify-end">
              <div class="col-span-12">
                <button mat-flat-button color="primary">Submit</button>
                <button mat-flat-button class="btn-cancel">Cancel</button>

              </div>
              <div class="col-span-12"></div>
            </div>
          </div>

            
        </mat-card-content>
        <mat-card-content class="border-t border-border"> </mat-card-content>
      </mat-card>
    </form>
  </div>
</div>
